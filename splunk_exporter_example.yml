
# Monitoring console (or Search Head)
url: https://localhost:8089

# Splunk API key
token: '<insert api key>'
# OR
user: 'changeme'
password: 'changeme'

# should we skip TLS validation ?
insecure: false

# Which indexed metrics do you wish to export ?
metrics:
  - index: _metrics
    name: spl.intr.disk_objects.Indexes.data.total_event_count
  - index: _metrics
    name: spl.intr.disk_objects.Indexes.data.total_bucket_count
  - index: _metrics
    name: spl.mlog.searchscheduler.max_lag
  - index: _metrics
    name: spl.mlog.searchscheduler.skipped

# Search head cluster and KV store replication monitoring (optional)
# distributed search group, as defined on the Monitoring Console, holding search head cluster members
shc:
  server_group: dmc_searchheadclustergroup_shc
